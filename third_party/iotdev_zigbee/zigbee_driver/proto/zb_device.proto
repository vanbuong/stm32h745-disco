syntax = "proto2";

message zb_endpoint_info {
    required uint32 endpoint_id = 1;
    required uint32 profile_id = 2;
    required uint32 device_id = 3;
    required uint32 ias_zone_type = 4;
    required uint32 color_caps = 5;
    required bool color_caps_valid = 6;
    repeated uint32 in_cluster_list = 7 [packed = true];
    repeated uint32 out_cluster_list = 8 [packed = true];
    optional uint32 color_temp_min = 9;
    optional uint32 color_temp_max = 10;
}

message zb_device_info {
    required uint64 ieee_addr = 1;
    required uint64 parent_ieee = 2;
    required uint32 nwk_addr = 3;
    required uint32 manu_id = 4;
    required string manufacturer = 5;
    required string model = 6;
    required uint32 capabilities = 7;
    repeated zb_endpoint_info endpoints = 8;
    // Extended Basic-cluster identity (optional for backward compatibility
    // with device files written before these fields existed).
    optional uint32 hw_version = 9;
    optional string date_code = 10;
    optional bytes product_code = 11;
    optional string serial_number = 12;
    optional string product_label = 13;
    optional string sw_build_id = 14;
    optional uint32 power_source = 15;
}
