name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - run: chmod +x scripts/ci/check-format.sh scripts/ci/check-layering.sh scripts/ci/size-report.sh
      - run: ./scripts/ci/check-format.sh

  layering:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/ci/check-layering.sh
      - run: ./scripts/ci/check-layering.sh

  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y cmake gcovr
      - run: cmake --preset host-tests
      - run: cmake --build --preset host-tests
      - run: ctest --test-dir build-host --output-on-failure
      - name: coverage
        run: |
          gcovr --root . \
            --filter 'firmware/src/svc' \
            --filter 'firmware/src/ipc' \
            --exclude 'firmware/src/osal' \
            --exclude 'firmware/src/svc/vendor' \
            --fail-under-line 80 \
            --xml build-host/coverage.xml \
            --html-details build-host/coverage.html
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            build-host/coverage.xml
            build-host/coverage.html
            build-host/coverage.css
          if-no-files-found: ignore

  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y cmake cppcheck clang-tidy
      - run: cmake --preset host-tests
      - run: cmake --build --preset host-tests
      - name: cppcheck
        run: |
          cppcheck --project=build-host/compile_commands.json \
            --enable=warning,performance,portability \
            --error-exitcode=1 \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --std=c11 \
            -i tests \
            -i third_party \
            -i firmware/src/svc/vendor
      - name: clang-tidy
        run: |
            clang-tidy -p build-host \
            firmware/src/ipc/ipc_ring.c \
            firmware/src/ipc/ipc_link.c \
            firmware/src/svc/vfs_path.c \
            firmware/src/svc/znp_mt.c \
            firmware/src/svc/media_probe.c \
            firmware/src/svc/text_view.c \
            firmware/src/svc/media_image.c \
            firmware/src/svc/media_bmp.c \
            firmware/src/svc/media_jpeg.c \
            firmware/src/svc/media_png.c \
            firmware/src/svc/media_audio.c \
            firmware/src/svc/audio_mix.c \
            firmware/src/svc/audio_pipe.c \
            firmware/src/svc/audio.c \
            firmware/src/svc/audio_engine.c \
            firmware/src/svc/net.c \
            firmware/src/svc/time.c \
            firmware/src/svc/auto.c \
            firmware/src/svc/memtest.c \
            firmware/src/bsp/mpu_map.c \
            firmware/src/shell/nav.c \
            firmware/src/shell/launcher_geom.c \
            firmware/src/app/files.c \
            firmware/src/app/image_view.c \
            firmware/src/app/player.c \
            firmware/src/app/network.c

  cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y cmake gcc-arm-none-eabi ninja-build
      - run: chmod +x scripts/ci/size-report.sh
      - run: cmake --preset Debug && cmake --build --preset Debug
      - run: cmake --preset m7-debug && cmake --build --preset m7-debug
      - run: cmake --preset m4-debug && cmake --build --preset m4-debug
      - run: ./scripts/ci/size-report.sh CM7/build/firmware-m7.elf CM4/build/firmware-m4.elf
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-elf
          path: |
            CM7/build/firmware-m7.elf
            CM4/build/firmware-m4.elf

  host-sim:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Ubuntu packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libsdl2-dev
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Windows Ninja
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y
      - run: cmake --preset host-sim
      - run: cmake --build --preset host-sim
